<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN">
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
    {% include 'header.html' %}
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-xs-6 span9">
                <h3>
                    这个是我的第一个python小网站，用来练习PYTHON/MYSQL/前端技能
                </h3>
            </div>
            <div class="col-xs-6 span3">
                <span class="badge">这里用来放LOGO</span>
            </div>
        </div>
        <div class="row">
            <div class="span12">
                <ul class="nav nav-tabs">
                    <li>
                        <a href="{{ url_for('Index') }}">我的博客</a>
                    </li>
                    <li class="active">
                        <a href="{{ url_for('Weibo', id=0) }}">匿名微博</a>
                    </li>
                    <li class="dropdown pull-left">
                        <a class="dropdown-toggle" data-toggle="dropdown" href="#">示例数据库</a>
                        <ul class="dropdown-menu">
                            <li>
                                <a href="{{ url_for('DataGet', database='sakila', table='actor') }}">sakila</a>
                            </li>
                            <li>
                                <a href="{{ url_for('DataGet', database='sakila', table='film') }}">film</a>
                            </li>
                            <li class="divider">
                            </li>
                            <li>
                                <a href="#">阅读源代码</a>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
        <div class="row">
            <div class="span12">
                <div class="well">
                    <h4>发布微博（最多140字）</h4>
                    <form method="POST" action="{{ url_for('WeiboPost') }}">
                        <div class="form-group">
                            <label for="username">用户名：</label>
                            <input type="text" class="form-control" id="username" name="username" placeholder="输入用户名">
                        </div>
                        <div class="form-group">
                            <label for="content">微博内容：</label>
                            <textarea class="form-control" id="content" name="content" rows="3" maxlength="140" placeholder="输入微博内容（最多140字）"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">发布</button>
                    </form>
                </div>
                <div class="row marketing">
                    {% for weibo in weibo_list %}
                    <div class="col-lg-12 well">
                        <h4>
                            {{ weibo.username }}
                            <small class="text-muted">{{ weibo.ip }} - {{ weibo.time }}</small>
                        </h4>
                        <p>
                            {{ weibo.content }}
                        </p>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</body>

</html>
